<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Dark Background container -->
  <rect width="512" height="512" rx="128" fill="#09090b"/>

  <g transform="translate(256, 256) rotate(-18) translate(-256, -256)">
    <!-- Orange Ellipse / Planet Ring -->
    <ellipse cx="256" cy="256" rx="200" ry="100" fill="#f95721" stroke="#000000" stroke-width="20"/>
    
    <!-- Retro Sparkle Star -->
    <path d="M 130 180 Q 130 150 110 150 Q 130 150 130 120 Q 130 150 150 150 Q 130 150 130 180 Z" fill="#000000"/>
  </g>

  <!-- Heavy Drop Shadow for "H" -->
  <text x="268" y="348" dominant-baseline="middle" text-anchor="middle" fill="#000000" font-family="system-ui, sans-serif" font-weight="900" font-size="280">H</text>
  
  <!-- Yellow Retro Bold "H" -->
  <text x="250" y="330" dominant-baseline="middle" text-anchor="middle" fill="#ffcc00" stroke="#000000" stroke-width="12" font-family="system-ui, sans-serif" font-weight="900" font-size="280">H</text>
</svg>
