<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Dark Box -->
  <rect width="512" height="512" rx="128" fill="#000000"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#27272a" stroke-width="12"/>

  <!-- Back Letter 'S' (Orange Pop) -->
  <text x="310" y="350" dominant-baseline="middle" text-anchor="middle" fill="#f97316" font-family="'Arial Black', sans-serif" font-weight="900" font-size="260">S</text>

  <!-- Front Letter 'H' (Electric Yellow with Thick Black Outline) -->
  <text x="200" y="310" dominant-baseline="middle" text-anchor="middle" fill="#facc15" stroke="#000000" stroke-width="18" font-family="'Arial Black', sans-serif" font-weight="900" font-size="280">H</text>
</svg>
